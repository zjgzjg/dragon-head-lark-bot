name: 龙头战法飞书推送

on:
  schedule:
    # 北京时间 9:25 竞价（UTC 1:25，周一到周五）
    - cron: "25 1 * * 1-5"
    # 北京时间 15:35 收盘后（UTC 7:35，周一到周五）
    - cron: "35 7 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: "任务类型"
        required: true
        default: close
        type: choice
        options:
          - close
          - auction

concurrency:
  group: dragon-head-lark
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 竞价快报
        if: |
          github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'auction' ||
          github.event_name == 'schedule' && github.event.schedule == '25 1 * * 1-5'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          WATCHLIST_MODE: ${{ vars.WATCHLIST_MODE || 'auto' }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          MAINLINE_KEYWORD: ${{ vars.MAINLINE_KEYWORD || '机器人' }}
          THERMOMETER: ${{ vars.THERMOMETER || '603278' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python run_auction.py

      - name: 收盘复盘
        if: |
          github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'close' ||
          github.event_name == 'schedule' && github.event.schedule == '35 7 * * 1-5'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          WATCHLIST_MODE: ${{ vars.WATCHLIST_MODE || 'auto' }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          MAINLINE_KEYWORD: ${{ vars.MAINLINE_KEYWORD || '机器人' }}
          THERMOMETER: ${{ vars.THERMOMETER || '603278' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python run_close.py
