name: 龙头战法飞书推送

on:
  schedule:
    # 北京时间 9:25 竞价（UTC 1:25，周一到周五）
    - cron: "25 1 * * 1-5"
    # 北京时间 15:10 收盘后（UTC 7:10，周一到周五）
    - cron: "10 7 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: "任务类型"
        required: true
        default: close
        type: choice
        options:
          - close
          - auction

concurrency:
  group: dragon-head-lark
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: 计算竞价交易日（北京）
        if: |
          github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'auction' ||
          github.event_name == 'schedule' && github.event.schedule == '25 1 * * 1-5'
        id: auction_meta
        run: |
          SESSION=$(TZ=Asia/Shanghai date +%Y%m%d)
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"

      - name: 恢复收盘定版名单
        if: |
          github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'auction' ||
          github.event_name == 'schedule' && github.event.schedule == '25 1 * * 1-5'
        uses: actions/cache/restore@v4
        id: watchlist_cache
        with:
          path: watchlist_snapshot.json
          # 精确到「竞价交易日」前缀；避免 watchlist- 误匹配其它日期
          key: watchlist-${{ steps.auction_meta.outputs.session }}-${{ github.run_id }}
          restore-keys: |
            watchlist-${{ steps.auction_meta.outputs.session }}-

      - name: 竞价快报
        if: |
          github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'auction' ||
          github.event_name == 'schedule' && github.event.schedule == '25 1 * * 1-5'
        env:
          TZ: Asia/Shanghai
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          WATCHLIST_MODE: ${{ vars.WATCHLIST_MODE || 'auto' }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          MAINLINE_KEYWORD: ${{ vars.MAINLINE_KEYWORD || '机器人' }}
          THERMOMETER: ${{ vars.THERMOMETER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          if [ -f watchlist_snapshot.json ]; then
            echo "已恢复 watchlist_snapshot.json:"
            cat watchlist_snapshot.json
          else
            echo "未恢复 watchlist_snapshot.json，竞价将临时扫池"
          fi
          python run_auction.py

      - name: 计算次日竞价交易日（北京）
        if: |
          github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'close' ||
          github.event_name == 'schedule' && github.event.schedule == '10 7 * * 1-5'
        id: close_meta
        run: |
          NEXT=$(python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          d = datetime.now(ZoneInfo("Asia/Shanghai")).date()
          for _ in range(8):
              d += timedelta(days=1)
              if d.weekday() < 5:
                  print(d.strftime("%Y%m%d"))
                  break
          PY
          )
          echo "next_session=$NEXT" >> "$GITHUB_OUTPUT"

      - name: 收盘复盘
        if: |
          github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'close' ||
          github.event_name == 'schedule' && github.event.schedule == '10 7 * * 1-5'
        env:
          TZ: Asia/Shanghai
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          WATCHLIST_MODE: ${{ vars.WATCHLIST_MODE || 'auto' }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          MAINLINE_KEYWORD: ${{ vars.MAINLINE_KEYWORD || '机器人' }}
          THERMOMETER: ${{ vars.THERMOMETER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          python run_close.py
          if [ -f watchlist_snapshot.json ]; then
            echo "写入 watchlist_snapshot.json:"
            cat watchlist_snapshot.json
          else
            echo "警告: 未生成 watchlist_snapshot.json"
            exit 1
          fi

      - name: 缓存次日竞价名单
        if: |
          github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'close' ||
          github.event_name == 'schedule' && github.event.schedule == '10 7 * * 1-5'
        uses: actions/cache/save@v4
        with:
          path: watchlist_snapshot.json
          # 同一 session 多次收盘可覆盖：每次 run_id 新 key，竞价按 session 前缀取最新
          key: watchlist-${{ steps.close_meta.outputs.next_session }}-${{ github.run_id }}
