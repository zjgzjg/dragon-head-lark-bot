name: 龙头战法·竞价推送

on:
  schedule:
    - cron: "25 9 * * 1-5"
      timezone: Asia/Shanghai
  workflow_dispatch:

concurrency:
  group: dragon-head-auction
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -f
          pip install -r requirements.txt
          playwright install chromium

      - name: 计算竞价交易日（北京）
        id: auction_meta
        run: |
          SESSION=$(TZ=Asia/Shanghai date +%Y%m%d)
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"

      - name: 恢复收盘定版名单
        uses: actions/cache/restore@v4
        with:
          path: watchlist_snapshot.json
          key: watchlist-${{ steps.auction_meta.outputs.session }}-${{ github.run_id }}
          restore-keys: |
            watchlist-${{ steps.auction_meta.outputs.session }}-

      - name: 竞价快报
        env:
          TZ: Asia/Shanghai
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          WATCHLIST_MODE: ${{ vars.WATCHLIST_MODE || 'auto' }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          MAINLINE_KEYWORD: ${{ vars.MAINLINE_KEYWORD || '机器人' }}
          THERMOMETER: ${{ vars.THERMOMETER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          if [ -f watchlist_snapshot.json ]; then
            echo "已恢复 watchlist_snapshot.json:"
            cat watchlist_snapshot.json
          else
            echo "未恢复 watchlist_snapshot.json，竞价将临时扫池"
          fi
          python run_auction.py
